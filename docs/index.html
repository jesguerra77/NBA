<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Picks - Panel Analítico</title>
    <style>
        /* CSS PURO - DISEÑO OSCURO ANALÍTICO */
        :root {
            --bg-base: #0a0a0a;
            --bg-surface: #141414;
            --bg-surface-hover: #1f1f1f;
            --bg-header: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: #27272a;
            --tier-elite: #10b981; /* Verde esmeralda */
            --tier-elite-bg: rgba(16, 185, 129, 0.15);
            --tier-fuerte: #3b82f6; /* Azul */
            --tier-fuerte-bg: rgba(59, 130, 246, 0.15);
            --edge-color: #fbbf24; /* Amarillo/Dorado */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        /* Encabezado */
        .dashboard-header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            padding: 20px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            gap: 15px;
        }

        /* Contenedor Principal */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Sección de cada Partido */
        .game-section {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden; /* Para redondear los bordes de la tabla interior */
        }

        .game-header {
            background-color: var(--bg-header);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-header::before {
            content: '🏀';
            font-size: 1.2rem;
        }

        /* Contenedor responsivo para la tabla */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        /* Tablas de Picks */
        .picks-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .picks-table th, 
        .picks-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .picks-table th {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .picks-table tr:last-child td {
            border-bottom: none;
        }

        .picks-table tbody tr {
            transition: background-color 0.2s ease;
        }

        .picks-table tbody tr:hover {
            background-color: var(--bg-surface-hover);
        }

        /* Celdas específicas */
        .col-pick {
            font-weight: 700;
            font-size: 1.05rem;
            white-space: nowrap;
        }

        .col-type {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: capitalize;
        }

        /* Badges / Etiquetas */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .badge-elite {
            color: var(--tier-elite);
            background-color: var(--tier-elite-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-fuerte {
            color: var(--tier-fuerte);
            background-color: var(--tier-fuerte-bg);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .edge-value {
            color: var(--edge-color);
            font-weight: 700;
        }

        .analysis-text {
            font-size: 0.85rem;
            color: #d4d4d8;
            max-width: 400px;
        }

        .analysis-text strong {
            color: var(--text-secondary);
            display: block;
            margin-bottom: 2px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        /* Responsividad para móviles */
        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .picks-table th, .picks-table td {
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>

    <header class="dashboard-header">
        <div class="header-title">
            <h1 id="main-title">Análisis Estratégico Postemporada NBA</h1>
        </div>
        <div class="header-meta">
            <span id="date-display">📅 Ventana: --</span>
            <span id="model-display">⚙️ Fase: --</span>
        </div>
    </header>

    <main class="main-container" id="tables-container">
        <!-- Las tablas de los partidos se generarán aquí mediante JavaScript -->
    </main>

    <script>
        // Datos extraídos EXACTAMENTE del documento "Plan de Investigación NBA_ Picks y Análisis.docx"
        const docData = {
            "titulo": "Análisis Estratégico de la Postemporada de la NBA 2026",
            "ventana": "22 de abril de 2026",
            "fase": "Primera Ronda",
            "dashboard_generales": [
                {
                    "encuentro": "Philadelphia @ Boston",
                    "favorito": "Celtics -14.5",
                    "probabilidad": "77.72%",
                    "pick_moneyline": "Boston (-952)",
                    "perspectiva": "Boston lidera 1-0; Dominio absoluto"
                },
                {
                    "encuentro": "Portland @ San Antonio",
                    "favorito": "Spurs -11.5",
                    "probabilidad": "76.40%",
                    "pick_moneyline": "San Antonio (-699)",
                    "perspectiva": "San Antonio lidera 1-0; Ventaja física"
                },
                {
                    "encuentro": "Houston @ LA Lakers",
                    "favorito": "Rockets -4.5",
                    "probabilidad": "51.60% (LAL)",
                    "pick_moneyline": "Lakers (+164)",
                    "perspectiva": "Lakers lideran 1-0; Valor en veteranía"
                }
            ],
            "dashboard_totales": [
                {
                    "encuentro": "PHI vs BOS",
                    "total_ou": "216.5",
                    "tendencia": "50-33 Under (BOS)",
                    "seleccion": "Under 216.5",
                    "justificacion": "Defensa de Boston en casa y falta de anotación en PHI"
                },
                {
                    "encuentro": "POR vs SAS",
                    "total_ou": "220.5",
                    "tendencia": "42.7% Over (SAS)",
                    "seleccion": "Under 220.5",
                    "justificacion": "Pobre porcentaje de triple de Portland y defensa perimetral Spurs"
                },
                {
                    "encuentro": "HOU vs LAL",
                    "total_ou": "206.5",
                    "tendencia": "42-41 Over (LAL)",
                    "seleccion": "Under 207.5",
                    "justificacion": "Ritmo lento de LeBron y ausencia de Doncic/Durant"
                }
            ]
        };

        // Función para construir la interfaz basándose en las nuevas tablas
        function buildDashboard(data) {
            // Actualizar encabezado
            document.getElementById('main-title').innerText = data.titulo;
            document.getElementById('date-display').innerText = `📅 Ventana: ${data.ventana}`;
            document.getElementById('model-display').innerText = `⚙️ Fase: ${data.fase}`;

            const container = document.getElementById('tables-container');
            container.innerHTML = ''; // Limpiar contenedor

            // --- 1. CONSTRUIR TABLA DE PICKS GENERALES ---
            const sectionGen = document.createElement('section');
            sectionGen.className = 'game-section';
            
            let rowsGen = '';
            data.dashboard_generales.forEach(row => {
                rowsGen += `
                    <tr>
                        <td class="col-pick">${row.encuentro}</td>
                        <td class="col-type">${row.favorito}</td>
                        <td><span class="badge badge-fuerte">${row.probabilidad}</span></td>
                        <td class="edge-value">${row.pick_moneyline}</td>
                        <td class="analysis-text">${row.perspectiva}</td>
                    </tr>
                `;
            });

            sectionGen.innerHTML = `
                <div class="game-header">Dashboard de Picks Generales: Proyecciones de Victoria y Hándicap</div>
                <div class="table-responsive">
                    <table class="picks-table">
                        <thead>
                            <tr>
                                <th>Encuentro</th>
                                <th>Favorito (Hándicap)</th>
                                <th>Probabilidad de Victoria</th>
                                <th>Selección de Moneyline</th>
                                <th>Perspectiva de Serie</th>
                            </tr>
                        </thead>
                        <tbody>${rowsGen}</tbody>
                    </table>
                </div>
            `;
            container.appendChild(sectionGen);

            // --- 2. CONSTRUIR TABLA DE PICKS DE TOTALES ---
            const sectionTot = document.createElement('section');
            sectionTot.className = 'game-section';
            
            let rowsTot = '';
            data.dashboard_totales.forEach(row => {
                rowsTot += `
                    <tr>
                        <td class="col-pick">${row.encuentro}</td>
                        <td class="col-type">${row.total_ou}</td>
                        <td><span class="badge badge-elite">${row.tendencia}</span></td>
                        <td class="edge-value">${row.seleccion}</td>
                        <td class="analysis-text">${row.justificacion}</td>
                    </tr>
                `;
            });

            sectionTot.innerHTML = `
                <div class="game-header">Dashboard de Picks de Totales: Análisis de Over/Under y Ritmo</div>
                <div class="table-responsive">
                    <table class="picks-table">
                        <thead>
                            <tr>
                                <th>Encuentro</th>
                                <th>Total Proyectado (O/U)</th>
                                <th>Tendencia de la Temporada</th>
                                <th>Selección de Totales</th>
                                <th>Justificación Técnica</th>
                            </tr>
                        </thead>
                        <tbody>${rowsTot}</tbody>
                    </table>
                </div>
            `;
            container.appendChild(sectionTot);
        }

        // Ejecutar la función con los datos exactos del documento
        buildDashboard(docData);

    </script>
</body>
</html>
